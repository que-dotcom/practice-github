<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>自己紹介 | GitHub チーム開発ワークショップ</title>
  <style>
    :root { color-scheme: light; --ink:#192e38; --muted:#536a73; --line:#d8e4e5; --accent:#0c7c72; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#f5f9f8; line-height:1.75; }
    main { max-width:760px; margin:9vh auto; padding:24px; }
    article { background:#fff; padding:clamp(24px,5vw,52px); border:1px solid var(--line); border-radius:20px; box-shadow:0 16px 45px #163b3610; }
    .eyebrow { color:var(--accent); font-weight:800; letter-spacing:.12em; font-size:.78rem; text-transform:uppercase; }
    h1 { font-size:clamp(2rem,6vw,3.6rem); line-height:1.2; margin:.3em 0; }
    h2 { font-size:1.12rem; margin:2rem 0 .4rem; }
    p { margin:.5rem 0; }
    a { color:var(--accent); text-underline-offset:3px; }
    .back { display:inline-block; margin-top:28px; font-weight:700; }
    .note { color:var(--muted); font-size:.9rem; border-top:1px solid var(--line); margin-top:30px; padding-top:18px; }
  </style>
</head>
<body>
  <main>
    <article>
      <div class="eyebrow">Member profile</div>
      <h1>ここに表示名を書く</h1>
      <p>こんにちは！ 一言で自己紹介を書いてみましょう。</p>
      <h2>最近興味があること</h2>
      <p>例：Web制作、音楽、ゲーム、料理など。</p>
      <h2>今回やってみたいこと</h2>
      <p>このチーム開発で学びたいことを書いてください。</p>
      <a class="back" href="../index.html">← みんなの練習サイトへ</a>
      <p class="note">このページは公開されます。公開したくない個人情報は書かないでください。</p>
    </article>
  </main>
</body>
</html>
